services:
  fileflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileflow:local
    restart: unless-stopped
    init: true
    ports:
      - "${FILEFLOW_HTTP_PORT:-5000}:5000"
    environment:
      FILEFLOW_HOST: "0.0.0.0"
      FILEFLOW_PORT: "5000"
      RUST_LOG: "${RUST_LOG:-warn}"
      MAX_BLOCK_SIZE: "${MAX_BLOCK_SIZE:-2097152}"
      MAX_BLOCKS_PER_FILE: "${MAX_BLOCKS_PER_FILE:-10240}"
      MAX_CACHE_BYTES: "${MAX_CACHE_BYTES:-268435456}"
      TRANSFER_WINDOW_BYTES: "${TRANSFER_WINDOW_BYTES:-33554432}"
      TRANSFER_MIN_WINDOW_BYTES: "${TRANSFER_MIN_WINDOW_BYTES:-2097152}"
      MAX_ACTIVE_HTTP_TRANSFERS: "${MAX_ACTIVE_HTTP_TRANSFERS:-128}"
      BLOCK_TTL_SECS: "${BLOCK_TTL_SECS:-600}"
      STUN_SERVER: "${STUN_SERVER:-}"
      TURN_SERVER: "${TURN_SERVER:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_CREDENTIAL: "${TURN_CREDENTIAL:-}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "${FILEFLOW_MEMORY_LIMIT:-512m}"
    memswap_limit: "${FILEFLOW_MEMORY_LIMIT:-512m}"
    logging:
      driver: "none"
