pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/fileflow-tls/server.crt;
        ssl_certificate_key /etc/fileflow-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 3m;
        location = /fileflow-ca.crt {
            alias /etc/fileflow-tls/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="fileflow-ca.crt"';
        }
        location / {
            proxy_pass http://fileflow:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
