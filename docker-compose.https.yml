# Use with: docker compose -p fileflow -f docker-compose.yml -f docker-compose.https.yml up -d --build
services:
  https:
    image: nginx:alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    depends_on:
      fileflow:
        condition: service_healthy
    ports:
      - "${FILEFLOW_HTTPS_PORT:-443}:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls/server.crt:/etc/fileflow-tls/server.crt:ro
      - ./deploy/tls/server.key:/etc/fileflow-tls/server.key:ro
      - ./deploy/tls/ca.crt:/etc/fileflow-tls/ca.crt:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: "none"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/api/fileflow/hello || exit 1"
      interval: 30s
      timeout: 3s
      retries: 3
